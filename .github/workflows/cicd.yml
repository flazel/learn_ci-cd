name: Python CI/CD Pipeline (GitOps Edition)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: simple-python-app
  # Ganti USERNAME_KAMU dengan username Docker Hub & GitHub kamu
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  GITOPS_REPO: ${{ github.repository_owner }}/learn_ci-cd-gitops

jobs:
  # ============================================
  # STAGE 1: Security, Code Quality & Tests
  # ============================================
  code-quality-and-test:
    name: 🔒 Quality, Security & Unit Tests
    runs-on: self-hosted
    steps:
      - name: Clean stale temp files
        run: rm -f /tmp/gitleaks* || true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Secret Scanning
      - name: Secret & Leaks Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Env & Run Unit Tests
      - name: Setup Virtual Env & Run Tests
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt pytest coverage
          coverage run -m pytest test_app.py
          coverage xml -o coverage.xml

      # 3. SonarQube Scan (Menggantikan Flake8 & Bandit)
      - name: SonarQube Code Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # 4. Dependency Security Scan
      - name: Dependency Scan
        run: |
          source venv/bin/activate
          pip install pip-audit
          pip-audit -r requirements.txt

  # ============================================
  # STAGE 2: Build, Scan & Push Docker Image
  # ============================================
  build-and-push:
    name: 🐳 Build, Scan & Push Docker Image
    runs-on: self-hosted
    needs: code-quality-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Trivy Scan Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Push Docker Image (SHA tag)
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ============================================
  # STAGE 3a: Deploy to Staging via GitOps
  # ============================================
  deploy-staging:
    name: 🚀 Update GitOps Repo (Staging)
    runs-on: self-hosted
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Update Staging Image Tag & Push
        run: |
          cd gitops-repo
          # Update tag image di deployment-staging.yaml (atau file staging kamu)
          sed -i 's|image: '${{ env.DOCKERHUB_USERNAME }}'/'${{ env.IMAGE_NAME }}':.*|image: '${{ env.DOCKERHUB_USERNAME }}'/'${{ env.IMAGE_NAME }}':'${{ github.sha }}'|g' deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment.yaml
          git commit -m "chore(staging): update image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push origin develop || git push origin main

  # ============================================
  # STAGE 3b: Deploy to Production via GitOps
  # ============================================
  deploy-production:
    name: 🚀 Update GitOps Repo (Production)
    runs-on: self-hosted
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Update Production Image Tag & Push
        run: |
          cd gitops-repo
          # Update tag image di deployment.yaml dengan SHA commit baru
          sed -i 's|image: '${{ env.DOCKERHUB_USERNAME }}'/'${{ env.IMAGE_NAME }}':.*|image: '${{ env.DOCKERHUB_USERNAME }}'/'${{ env.IMAGE_NAME }}':'${{ github.sha }}'|g' deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment.yaml
          git commit -m "chore(prod): update image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push origin main
