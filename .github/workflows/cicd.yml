name: Python CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # STAGE 1: Security & Code Quality
  # ============================================
  security-scan:
    name: 🔒 Security & Code Scan
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Secret & Leaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Virtual Env & Install Tools
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install flake8 bandit safety

      - name: Syntax Check (Linting)
        run: |
          source venv/bin/activate
          flake8 . --exclude=venv --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Code Security Scan (SAST)
        run: |
          source venv/bin/activate
          bandit -r . -ll -ii -x ./tests,./test_app.py,./venv

      - name: Dependency Scan
        run: |
          source venv/bin/activate
          safety check || true

  # ============================================
  # STAGE 2: Run Tests
  # ============================================
  test:
    name: 🧪 Python Tests
    runs-on: self-hosted
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt pytest

      - name: Run Tests
        run: |
          source venv/bin/activate
          pytest test_app.py

  # ============================================
  # STAGE 3: Build Docker Image
  # ============================================
  build:
    name: 🐳 Build Docker Image
    runs-on: self-hosted
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t simple-python-app:${{ github.sha }} \
            -t simple-python-app:latest \
            .

  # ============================================
  # STAGE 4: Deploy
  # ============================================
  deploy:
    name: 🚀 Deploy
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy Local Container
        run: |
          docker stop my-python-web || true
          docker rm my-python-web || true
          docker run -d -p 5000:5000 --name my-python-web simple-python-app:latest

      - name: Health Check
        run: |
          sleep 5
          curl -f http://localhost:5000/ || exit 1