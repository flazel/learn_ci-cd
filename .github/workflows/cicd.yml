name: Python DevSecOps CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  # JOB 1: Persiapan dan Cek Sintaks
  setup-and-lint:
    name: Setup & Syntax Check
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # Karena Fedora memblokir global pip install (PEP 668), kita pakai virtual environment
      - name: Linting Code
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # JOB 2: Scan Keamanan (Berjalan setelah Job 1 selesai)
  security-scans:
    name: Security & Secret Scans
    needs: setup-and-lint
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Secret & Leaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SAST & Dependency Scan
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install bandit safety
          bandit -r . -ll -ii -x ./tests,./test_app.py
          safety check || true

  # JOB 3: Unit Test (Berjalan PARALEL dengan Security Scans)
  unit-testing:
    name: Matrix: Unit Testing
    needs: setup-and-lint
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Pytest
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt pytest
          pytest test_app.py

  # JOB 4: Build Docker Image (Menunggu Job 2 & 3 selesai)
  docker-build:
    name: Build Application (Docker)
    needs: [security-scans, unit-testing]
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Build Docker Image
        run: docker build -t simple-python-app:latest .

  # JOB 5: Deploy (Menunggu Job 4 selesai)
  deploy-local:
    name: Deploy to Production (Local)
    needs: docker-build
    runs-on: self-hosted
    steps:
      - name: Deploy Local Container
        run: |
          docker stop my-python-web || true
          docker rm my-python-web || true
          docker run -d -p 5000:5000 --name my-python-web simple-python-app:latest