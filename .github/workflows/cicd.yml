name: Python CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: simple-python-app

jobs:
  # ============================================
  # STAGE 1: Security & Code Quality
  # ============================================
  security-scan:
    name: 🔒 Security & Code Scan
    runs-on: self-hosted
    steps:
      - name: Clean stale temp files
        run: rm -f /tmp/gitleaks* || true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret & Leaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Virtual Env & Install Tools
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install flake8 bandit safety pip-audit

      - name: Syntax Check (Linting)
        run: |
          source venv/bin/activate
          flake8 . --exclude=venv --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Code Security Scan (SAST)
        run: |
          source venv/bin/activate
          bandit -r . -ll -ii -x ./tests,./test_app.py,./venv

      - name: Dependency Scan
        run: |
          source venv/bin/activate
          pip-audit -r requirements.txt

  # ============================================
  # STAGE 2: Run Tests
  # ============================================
  test:
    name: 🧪 Python Tests
    runs-on: self-hosted
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt pytest

      - name: Run Tests
        run: |
          source venv/bin/activate
          pytest test_app.py

  # ============================================
  # STAGE 3: Build, Scan & Push Docker Image
  # ============================================
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: self-hosted
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Trivy Scan Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Push Docker Image (SHA tag)
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Tag & Push as environment-latest
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG=production-latest
          else
            TAG=staging-latest
          fi
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:$TAG
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:$TAG

  # ============================================
  # STAGE 4a: Deploy to Staging (develop branch)
  # ============================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Pull & Deploy
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker stop my-python-web-staging || true
          docker rm my-python-web-staging || true
          docker run -d -p 5001:5000 --name my-python-web-staging \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Health Check
        run: |
          sleep 5
          curl -f http://localhost:5001/ || exit 1

  # ============================================
  # STAGE 4b: Deploy to Production (main branch)
  # ============================================
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Save currently running image tag (for rollback)
        run: |
          docker inspect --format='{{index .Config.Image}}' my-python-web > last_successful_image.txt 2>/dev/null || echo "none" > last_successful_image.txt
          cat last_successful_image.txt

      - name: Pull & Deploy
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker stop my-python-web || true
          docker rm my-python-web || true
          docker run -d -p 5000:5000 --name my-python-web \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Health Check
        id: health_check
        run: |
          sleep 5
          curl -f http://localhost:5000/ || exit 1

      - name: Rollback on Failure
        if: failure() && steps.health_check.outcome == 'failure'
        run: |
          OLD_IMAGE=$(cat last_successful_image.txt)
          if [ "$OLD_IMAGE" != "none" ]; then
            echo "Health check failed, rolling back to $OLD_IMAGE"
            docker stop my-python-web || true
            docker rm my-python-web || true
            docker run -d -p 5000:5000 --name my-python-web $OLD_IMAGE
          else
            echo "No previous image found, cannot rollback automatically"
          fi
